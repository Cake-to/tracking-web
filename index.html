<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sua vida em formato de RPG: quests, metas, stats, XP e níveis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,400..900&family=Manrope:wght@400..800&display=swap">
<style>
/* Layout: app de celular de uma coluna, abas na base, botão central de registro.
   Direção: noite de cidade litorânea, céu de pôr do sol (rosa → laranja → amarelo) e neon. Um só mundo escuro, de propósito. */
:root{
  --bg:#0c0e12; --panel:#15181e; --panel2:#20242c; --line:#2b3039; --fg:#f3f4f6; --muted:#a2a8b3; --faint:#646b77;
  --sel:#f3f4f6; --sel-ink:#0c0e12;
  --sun1:#5a4a1e; --sun2:#a8842c; --sun3:#f0c24b;
  --gold:#f0c24b; --gold-ink:#1d1503;
  --money:#4cc77a; --body:#e8566f; --family:#9a78ff;
  --good:#4ff0ad; --warn:#ffb454; --bad:#ff5d6c;
  --f-display:"Saira", "Arial Narrow", system-ui, sans-serif;
  --f-poster:"Saira", Impact, "Arial Narrow", sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --r:18px; --r-s:12px; --r-xs:9px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--gold);font-weight:700;font-size:13px;padding:4px 0}

/* Cabeçalho do personagem */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.hero h1{font-family:var(--f-poster);font-weight:400;text-transform:uppercase;font-size:34px;letter-spacing:.02em;line-height:1}
.sunset{position:relative;overflow:hidden;margin-top:16px;padding:18px 16px 16px;border-radius:20px;
  background:linear-gradient(165deg,var(--sun1) 0%,var(--sun2) 55%,var(--sun3) 100%);color:#24062a}
.sunset::after{content:"";position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,#fff6c9 0%,#ffe08a55 45%,transparent 70%);pointer-events:none}
.sunset>*{position:relative;z-index:1}
.sunset .who .cls,.sunset .xpmeta{color:#4a1238;font-weight:600}
.sunset .badge{background:#24062a;border-color:#24062a;box-shadow:none}
.sunset .badge .lv{color:var(--sun3)} .sunset .badge .lvl{color:#ffb3d4}
.sunset h1{font-size:40px;color:#24062a}
.sunset .xpbar{background:#24062a55;border-color:transparent}
.sunset .xpbar>i{background:#24062a}
.sunset .chip{background:#24062a;border-color:#24062a;color:#fff3ef}
.sunset .chip b{color:var(--sun3)}
.who{display:flex;align-items:center;gap:14px}
.badge{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:16px;
  background:linear-gradient(160deg,#2b3270,#1a1f45);border:2px solid var(--gold);box-shadow:0 0 0 4px #ffcf5c1a}
.badge .lv{font-family:var(--f-poster);font-weight:400;font-size:30px;line-height:1;color:var(--gold)}
.badge .lvl{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.who h1{font-size:24px}
.who .cls{font-size:13px;color:var(--muted)}
.xpbar{height:12px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun1),var(--sun2),var(--sun3));border-radius:999px;transition:width .6s ease}
.xpmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip b{font-family:var(--f-display)}

/* Áreas */
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.area{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.area .t{font-size:12px;font-weight:800;line-height:1.2;color:var(--a)}
.area .l{font-family:var(--f-display);font-size:20px;font-weight:700}
.mini{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
.mini>i{display:block;height:100%;background:var(--a);border-radius:999px}

/* Atributos */
.attrs{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.attrs .k{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--a)}
.attrs .v{font-family:var(--f-display);font-size:14px;text-align:right;min-width:2ch}

/* Totais da jornada */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.05;color:var(--a,var(--fg));font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted);line-height:1.25}
/* Anéis semanais */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ring{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.ring.done{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.ring-g{position:relative;width:84px;height:84px}
.ring-g svg{width:100%;height:100%;display:block}
.ring-g svg circle{transition:stroke .4s ease}
.ring-i{position:absolute;inset:0;display:grid;place-items:center;color:var(--a)}
.ring.done .ring-i{color:var(--gold)}
.ring-i svg{width:28px;height:28px}
.ring-t{font-size:12px;font-weight:700;line-height:1.25}
/* Botões rápidos e janela da task */
.plus{border:0;background:var(--a);color:#14082a;font-family:var(--f-display);font-weight:700;font-size:15px;border-radius:10px;padding:5px 12px;min-width:44px;min-height:32px}
.goal[data-open]{cursor:pointer}
.goal[data-open]:active{background:var(--panel2)}
.ring{cursor:pointer}
.ring-foot{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.sheet h2.sub{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:700;font-family:var(--f-display);font-size:16px}
.chipsel button:active{background:var(--a);color:#14082a}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:inherit;font-size:16px}
.bigprog{display:flex;flex-direction:column;gap:6px}
.bigprog .pbar{height:14px}
.bigval{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.bigval small{font-size:15px;color:var(--muted);font-weight:500}
.stepper{display:flex;gap:10px}
.stepper button{flex:1;padding:14px;font-size:20px;font-family:var(--f-display);font-weight:700;border-radius:12px}
/* Troféus, semana, calendário */
.tros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0;opacity:.62}
.tro.ok{opacity:1;border-color:color-mix(in srgb,var(--a) 55%,var(--line));background:color-mix(in srgb,var(--a) 9%,var(--panel))}
.tro-i{font-size:20px;line-height:1}
.tro b{font-size:13px;line-height:1.2}
.tro span{font-size:11px;color:var(--muted)}
.tro .mini{display:block;--a:var(--faint)}
.wk{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk-l{color:var(--muted);font-size:14px}
.wk b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.wk-d{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk-d.up{color:var(--good)} .wk-d.down{color:var(--warn)}
.heat-wrap{display:flex;gap:6px;overflow-x:auto}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--faint)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(12,1fr);gap:3px;flex:1;min-width:0}
.hc{display:block;aspect-ratio:1;border-radius:3px;background:var(--panel2);min-width:10px}
.hc.l1{background:color-mix(in srgb,var(--sun1) 35%,var(--panel2))}
.hc.l2{background:color-mix(in srgb,var(--sun1) 70%,var(--panel2))}
.hc.l3{background:var(--sun2)}
.hc.l4{background:var(--sun3)}
.hc.lf{background:transparent;border:1px dashed var(--line)}
.heat-leg{display:flex;gap:4px;align-items:center}
.heat-leg .hc{width:12px;min-width:12px}
@media (max-width:380px){.tros{grid-template-columns:repeat(2,1fr)}}
.season{gap:12px}.season.cur{border-color:var(--gold)}
.season-l{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--panel2);font-family:var(--f-display);font-weight:700;font-size:20px;border-radius:4px}
.season.cur .season-l{background:var(--sel);color:var(--sel-ink)}
.decay{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-left:3px solid var(--warn);padding:6px 10px}
.decay b{color:var(--fg)}
.gico{display:inline-grid;vertical-align:-3px;margin-right:6px;color:var(--a)}.gico svg{width:16px;height:16px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icb{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:4px;display:grid;place-items:center;color:var(--fg)}
.icb svg{width:20px;height:20px}.icb[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.remind{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.remind summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:14px}
.remind summary svg{width:18px;height:18px;color:var(--gold)}
.remind summary::-webkit-details-marker{display:none}
.chipsel a.btn{text-decoration:none;color:var(--fg)}
.orgbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}
.pwrap{border:1px dashed var(--faint);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px}
.pwrap .pmove{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.pwrap .pmove span{display:flex;gap:6px}
.pwrap .hero{padding-top:0}.pwrap .sunset{margin-top:0}
/* Central de personalização */
.pencil{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--fg);display:inline-grid;place-items:center;font-size:16px}
.pencil svg{width:18px;height:18px}
.qs-scrim{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px 14px;background:#05060999;backdrop-filter:blur(14px) saturate(.9);-webkit-backdrop-filter:blur(14px)}
.qs{width:100%;max-width:440px;max-height:calc(100% - 20px);overflow:auto;background:color-mix(in srgb,#2a2f38 78%,transparent);border:1px solid #ffffff14;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000c;animation:qsin .22s ease}
@keyframes qsin{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.qs-head{display:flex;justify-content:space-between;align-items:center}.qs-head b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}.qs-head span{display:flex;gap:8px}
.qs-sec,.qgh{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qpills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qpill{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:999px;padding:8px 12px 8px 8px;background:#ffffff10;color:var(--fg);min-width:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.qpill-i{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#ffffff1c;font-size:12px}
.qpill.on .qpill-i{background:var(--sel);color:var(--sel-ink)}
.qpill b{display:block;font-size:13px;line-height:1.15;overflow-wrap:anywhere}.qpill small{font-size:11px;color:var(--muted)}
.qpill>span:last-child{min-width:0}
.qgroup{background:#ffffff0a;border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;gap:10px}
.qgh{padding-left:8px;color:var(--a)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px}
.qt{background:none;border:0;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;min-width:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.qt-c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#ffffff1a;color:var(--muted);transition:background .15s,color .15s}
.qt-c svg{width:24px;height:24px}
.qt.on .qt-c{background:var(--sel);color:var(--sel-ink)}
.qt.idea .qt-c{background:transparent;border:1.5px dashed #ffffff40}
.qt.add .qt-c{background:transparent;border:1.5px dashed #ffffff40;font-size:24px}
.qt-l{font-size:11.5px;line-height:1.2;text-align:center;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.qt.on .qt-l{color:var(--fg)}
.qt:active .qt-c{transform:scale(.93)}
.qs-hint{font-size:11.5px;color:var(--faint);text-align:center}
.qren{display:flex;flex-direction:column;gap:6px;background:#ffffff0a;border-radius:16px;padding:10px}.qren label{font-size:12px;color:var(--muted)}
/* Stats */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stat .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stat .big small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.delta{font-size:13px;font-weight:700}
.spark{width:100%;height:56px;display:block}

/* Quests */
.tabs2{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs2 button{flex:1;background:none;border:0;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.quest{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.quest.sugg{border-style:dashed;background:transparent}
.qhead{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 10px}
.qicon{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.qicon svg{width:22px;height:22px}
.qtitle{flex:1;min-width:0}
.qtitle h3{font-family:var(--f-poster);font-weight:400;font-size:21px;text-transform:uppercase;letter-spacing:.02em}
.qtitle .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tag.main{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.tag.sg{background:transparent;border:1px dashed var(--faint)}
.goals{display:flex;flex-direction:column}
.goal{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.grow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grow .gt{font-weight:600;min-width:0}
.grow .gv{font-family:var(--f-display);font-size:13px;white-space:nowrap;color:var(--muted)}
.pbar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--a);border-radius:999px;transition:width .5s ease}
.goal.done .pbar>i{background:var(--gold)}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.gact{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.claimed{color:var(--gold);font-weight:800;font-size:12px}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px;border-top:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center;font-size:14px}

/* Histórico */
.day{display:flex;flex-direction:column;gap:6px}
.day h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.log{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.log .qicon{width:32px;height:32px;border-radius:9px}
.log .qicon svg{width:18px;height:18px}
.log .d{flex:1;min-width:0}
.log .d b{display:block;font-weight:700}
.log .d span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.log .x{font-family:var(--f-display);color:var(--gold);font-size:13px;white-space:nowrap}

/* Navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.nav button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--faint);padding:4px}

/* v30: movimento */
:root{--e-out:cubic-bezier(.22,1,.36,1);--sh-d:.38s;--sh-e:var(--e-out);--sh-y:100%;--sc-d:.28s;--r-d:.26s;--r-e:cubic-bezier(.3,1.25,.5,1);--r-s:.55;--r-st:22ms;--en-d:.32s;--en-y:8px}

.scrim{animation:scin var(--sc-d) ease backwards}

.sh-ghost .scrim.out{opacity:0}
.sh-ghost .scrim.out .sheet{transform:translateY(var(--sh-y))!important}
html[data-motion=sutil] .sh-ghost .scrim.out .sheet{opacity:0}
.radial{transition:opacity var(--sc-d) ease}
.rad-o{transform:scale(var(--r-s));transition:transform var(--r-d) var(--r-e) calc(var(--i,0) * var(--r-st)),opacity var(--r-d) ease calc(var(--i,0) * var(--r-st))}
.rad-c{transition:transform var(--r-d) var(--r-e)}
.radial:not(.on) .rad-c{transform:scale(.8)}
.rad-o.sel span{transition:transform .18s var(--r-e),background .12s}
#app.enter{animation:enter var(--en-d) var(--e-out) backwards}
@keyframes enter{from{opacity:0;transform:translate(var(--en-x,0px),var(--en-y))}to{opacity:1;transform:none}}
/* entrada das bolhas em cascata */
@keyframes catIn{from{opacity:0;transform:translateY(12px) scale(.84)}to{opacity:1;transform:none}}
#app.enter .ts-orb .cat{animation:catIn calc(var(--en-d) + .18s) var(--e-out) backwards;animation-delay:calc(var(--gi,0) * 90ms + var(--ci,0) * 45ms + 80ms)}
.ts-orb .tg:nth-child(2){--gi:1}.ts-orb .tg:nth-child(3){--gi:2}.ts-orb .tg:nth-child(4){--gi:3}
.ts-orb .cat:nth-child(2){--ci:1}.ts-orb .cat:nth-child(3){--ci:2}.ts-orb .cat:nth-child(4){--ci:3}.ts-orb .cat:nth-child(5){--ci:4}
/* contador que rola, brilho que percorre o anel, nível que acende */
.roll{display:inline-block;font:inherit;color:inherit;animation:roll .45s var(--e-out)}
@keyframes roll{from{transform:translateY(75%);opacity:0}to{transform:none;opacity:1}}
.ts-orb .cat.bump .cat-r::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(transparent 0 64%,color-mix(in srgb,var(--a) 45%,#fff) 82%,transparent 94%);-webkit-mask:radial-gradient(circle closest-side,transparent 80%,#000 84%,#000 93%,transparent 97%);mask:radial-gradient(circle closest-side,transparent 80%,#000 84%,#000 93%,transparent 97%);animation:sweep .85s var(--e-out) forwards}
@keyframes sweep{from{transform:rotate(-120deg);opacity:1}70%{opacity:.9}to{transform:rotate(240deg);opacity:0}}
.top-sub.glow{animation:lvglow 2.6s ease-out}
@keyframes lvglow{0%,25%{color:var(--gold);text-shadow:0 0 14px color-mix(in srgb,var(--gold) 65%,transparent)}100%{color:var(--muted);text-shadow:none}}

.dd[open]>:not(summary){animation:enter var(--en-d) var(--e-out) backwards}

.quest .chev{transition:transform var(--en-d) var(--e-out)}
.quest.open .goals{animation:enter var(--en-d) var(--e-out) backwards}
.kind{border:0!important;background:var(--surf2)!important}
.chipsel button,.seg button{border-color:transparent;background:var(--surf2)}

/* v31: ciclo das tasks */
.goal.cyc{opacity:.6}

/* v36: tasks mais leves */
.goal{padding:12px 14px;gap:7px}

// Nível = XP dos últimos 30 dias (janela móvel: sobe e desce). Progressivo até 20.
// Do nível L ao L+1 custa 60 + 12*(L-1) XP. Nível 20 = 3.192 XP ≈ 30 dias batendo todas as tasks.
const MAXL=20,WIN=30*864e5;
const DECAY_K=1.1; // calibrado: mês perfeito (XP por constância + tasks, com decaimento) chega no nível 20 por volta do dia 28
const xpToReach=L=>Math.round(DECAY_K*(60*(L-1)+6*(L-1)*(L-2)));
const decayW=age=>age<=7*864e5?1:age>=WIN?0:(WIN-age)/(23*864e5); // 100% até 7 dias, cai até 0 no dia 30
function levelOf(xp){let L=1;while(L<MAXL&&xpToReach(L+1)<=xp)L++;if(L>=MAXL)return{L:MAXL,into:xp-xpToReach(MAXL),need:0,pct:1,max:true};const a=xpToReach(L),b=xpToReach(L+1);return{L,into:xp-a,need:b-a,pct:(xp-a)/(b-a)};}
const areaLevel=xp=>levelOf(xp*3);
const dayKey=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const monthKey=d=>dayKey(d).slice(0,7);
function periodStart(p,since){const n=new Date();let s;
  if(p==="day")s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  else if(p==="week"){s=new Date(n.getFullYear(),n.getMonth(),n.getDate());const wd=(s.getDay()+6)%7;s.setDate(s.getDate()-wd);}
  else if(p==="month")s=new Date(n.getFullYear(),n.getMonth(),1);
  else if(p==="year")s=new Date(n.getFullYear(),0,1);
  else s=since?new Date(since):new Date(0);
  return s.getTime();}
function periodKey(p){const n=new Date();if(p==="day")return "d"+dayKey(n);if(p==="week"){return "w"+dayKey(periodStart("week"));}if(p==="month")return monthKey(n);if(p==="year")return String(n.getFullYear());return "all";}

function writeDoc(path,data){ // uma escrita por vez por documento, coalescendo
  const q=queues[path]||(queues[path]={busy:false,next:null});

  (async function run(){q.busy=true;while(q.next){const d=q.next;q.next=null;
    try{await db.doc(path).set(JSON.parse(JSON.stringify(d)));}catch(e){toast("Não consegui salvar. Confira sua conexão.");console.error(e);}}
    q.busy=false;})();
}

function latestStat(id){const l=allLogs().find(x=>x.kind==="stat"&&x.statId===id);return l?l.value:null;}
function statSeries(id){return allLogs().filter(x=>x.kind==="stat"&&x.statId===id).reverse();}
function stepStart(g){if(g.start!=null&&isFinite(+g.start))return +g.start;const st=S.stats.find(x=>x.id===g.statId);if(st&&st.start!=null)return +st.start;const ls=allLogs().filter(l=>l.kind==="stat"&&l.statId===g.statId);return ls.length?+ls[ls.length-1].value:null;}
function stepTotal(g){if(g.statId){const s0=stepStart(g),v=latestStat(g.statId);return s0==null||v==null?0:Math.max(0,Math.round((s0-v)*10)/10);}return allLogs().filter(l=>l.kind===g.kind).reduce((a,l)=>a+(+l.value||0),0);}
function stepList(g,upto){const b=(Array.isArray(g.steps)&&g.steps.length?g.steps:[200,500]).map(Number).filter(v=>v>0).sort((a,b)=>a-b);const ev=Math.max(1,+g.every||250);const out=b.slice();let v=out[out.length-1];while(out.length<400&&v<=upto+ev){v+=ev;out.push(v);}return out;}

function goalProgress(g){
  let cur=0,target=+g.target||0,pct=0;
  if(g.src==="steps"){cur=stepTotal(g);const cl=g.claims||[];const st=stepList(g,cur);const i=st.findIndex(v=>!cl.includes("m"+v));target=st[i];const prev=i>0?st[i-1]:0;pct=Math.max(0,Math.min(1,(cur-prev)/Math.max(1,target-prev)));
    return {cur,target,pct,done:cur>=target,claimed:false,pk:"m"+target,prev,n:i};}
  if(g.src==="manual"){cur=+g.current||0;pct=target?cur/target:0;}
  else if(g.src==="stat"){const v=latestStat(g.statId);cur=v==null?+g.start:v;const span=(+g.start)-target;pct=span?((+g.start)-cur)/span:(cur===target?1:0);}
  else{const from=periodStart(g.period,g.since);const ls=allLogs().filter(l=>l.kind===g.kind&&(!g.sub||l.sub===g.sub)&&new Date(l.t).getTime()>=from);
    cur=g.src==="count"?ls.length:ls.reduce((a,l)=>a+(+l.value||0),0);pct=target?cur/target:0;}
  pct=Math.max(0,Math.min(1,pct));
  const pk=periodKey(g.period||"all");const claimed=(g.claims||[]).includes(pk);
  return {cur,target,pct,done:pct>=1,claimed,pk};
}
function xpTotals(fromT,toT,wf){
  const by={money:0,body:0,family:0};const tt=iso=>new Date(iso||(S&&S.createdAt)).getTime();const inR=iso=>{const t=tt(iso);return (!fromT||t>=fromT)&&(!toT||t<toT);};
  const add=(a,v,iso)=>{if(!inR(iso))return;by[a]=(by[a]||0)+(+v||0)*(wf?wf(tt(iso)):1);};
  allLogs().forEach(l=>add(l.area,lxp(l),l.t));
  (S?S.quests:[]).forEach(q=>{(q.goals||[]).forEach(g=>{if(g.kind==="dinheiro")return;(g.claims||[]).forEach(pk=>add(q.area,g.xp,(g.claimT||{})[pk]));});if(q.status==="done")add(q.area,q.xp,q.doneAt);});
  if(S&&S.conq)Object.keys(S.conq).forEach(k=>{const [id,i]=k.split(":"),c=CQ[id];if(c&&!c.noxp&&CQT[+i])add(c.a,CQT[+i].xp,S.conq[k]);});
  if(wf)Object.keys(by).forEach(k=>by[k]=Math.round(by[k]));
  return {by,total:Object.values(by).reduce((a,x)=>a+x,0)};

function xpAt(at){return xpTotals(at-WIN,at+1,t=>decayW(at-t));}

function weekKey(t){const d=new Date(t);const s=new Date(d.getFullYear(),d.getMonth(),d.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7));return dayKey(s);}
function weeksHistory(){ // todas as semanas desde o início, mais recente primeiro
  if(!S)return [];const cur=periodStart("week");const first=new Date(weekKey(Math.min(new Date(S.createdAt).getTime(),...allLogs().map(l=>new Date(l.t).getTime()),Date.now()))+"T00:00").getTime();
  const out=[];for(let ws=cur;ws>=first-1000;){const we=new Date(ws);we.setDate(we.getDate()+7);const x=xpTotals(ws,we.getTime()),T=totals(ws,we.getTime());const end=Math.min(we.getTime(),Date.now());out.push({ws,we:we.getTime(),xp:x.total,by:x.by,L:levelOf(xpAt(end).total).L,T,current:ws===cur});const p=new Date(ws);p.setDate(p.getDate()-7);ws=p.getTime();}
  return out;}

function totals(fromT,toT){
  const ls=allLogs().filter(l=>{const t=new Date(l.t).getTime();return (!fromT||t>=fromT)&&(!toT||t<toT);});
  const c=(k,s)=>ls.filter(l=>l.kind===k&&(!s||l.sub===s)).length;
  const sum=(k,f)=>ls.filter(l=>l.kind===k).reduce((a,l)=>a+(+(f?l[f]:l.value)||0),0);
  const w=allLogs().filter(l=>l.kind==="stat"&&l.statId==="peso").reverse();
  const wIn=w.filter(l=>!fromT||new Date(l.t).getTime()>=fromT);
  const base=fromT?(w.filter(l=>new Date(l.t).getTime()<fromT).pop()||wIn[0]):w[0];
  const kg=w.length&&base?(w[w.length-1].value-base.value):0;
  const days=new Set(ls.map(l=>dayKey(l.t))).size;
  return {treinos:c("treino"),forca:c("treino","forca"),cardio:c("treino","cardio"),minTreino:sum("treino","minutes"),
    kg,reais:sum("dinheiro"),estudo:sum("estudo"),meditacoes:c("mente","meditacao"),leituras:c("mente","leitura"),livros:c("mente","livro"),

function morphKids(a,b){const an=[...a.childNodes],bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){const x=an[i],y=bn[i];
    if(!x){a.appendChild(y);continue;}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.dataset.cat||x.id||"")!==(y.dataset.cat||y.id||""))){a.replaceChild(y,x);continue;}
    if(x.nodeType===3||x.nodeType===8){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue;}
    morphNode(x,y);}

function morphNode(x,y){

function logSheet(kind,statId){
  let k=kind||"treino";

    const K=KINDS[k];const a=AREAS[K.area];
    let f="";
    if(k==="stat"){f=`<div class="field"><label for="l-stat">Stat</label><select id="l-stat">${S.stats.map(s=>`<option value="${esc(s.id)}" ${s.id===statId?"selected":""}>${esc(s.name)} (${esc(s.unit)})</option>`).join("")}</select></div>

    else{
      if(K.subs)f+=`<div class="field"><label>Tipo</label><div class="seg" style="--a:${a.color}" id="l-sub">${Object.entries(K.subs).map(([s,l],i)=>`<button type="button" data-sub="${esc(s)}" aria-pressed="${i===0}">${esc(l)}</button>`).join("")}</div></div>`;
      if(k==="dinheiro")f+=`<div class="field"><label for="l-val">Valor (R$)</label><div class="chipsel" style="--a:${a.color}">${[20,50,100,200,500].map(c=>`<button type="button" data-fill="${c}">R$ ${c}</button>`).join("")}</div><input id="l-val" inputmode="decimal" placeholder="ou digite um valor, ex: 137,50" required></div>`;
      if(k==="estudo")f+=`<div class="row2"><div class="field"><label for="l-val">Minutos</label><input id="l-val" inputmode="numeric" placeholder="ex: 45" required></div><div class="field"><label for="l-topic">Assunto</label><input id="l-topic" placeholder="opcional"></div></div>`;
      if(k==="treino"||k==="mente")f+=`<div class="field"><label for="l-min">Duração (min)</label><input id="l-min" inputmode="numeric" placeholder="opcional, dá mais XP"></div>`;
    }

  };
  const mount=sh=>{
    sh.addEventListener("click",e=>{const kb=e.target.closest("[data-kind]");if(kb){k=kb.dataset.kind;sh.innerHTML=draw();return;}
      const fb=e.target.closest("[data-fill]");if(fb){sh.querySelector("#l-val").value=fb.dataset.fill;return;}
      const sb=e.target.closest("[data-sub]");if(sb){sb.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===sb));}});
    sh.addEventListener("submit",e=>{e.preventDefault();
      const g=id=>{const el=sh.querySelector("#"+id);return el?el.value:""};const subEl=sh.querySelector("#l-sub [aria-pressed=true]");
      const l={kind:k,note:g("l-note").trim()};if(subEl)l.sub=subEl.dataset.sub;
      if(k==="stat"){l.statId=g("l-stat");l.value=num(g("l-val"));if(!isFinite(l.value)){toast("Informe um número, ex: 85,4");return;}}
      if(k==="dinheiro"){const v=num(g("l-val"));if(!isFinite(v)||v<=0){toast("Informe o valor em reais, ex: 200");return;}l.value=l.sub==="retirei"?-v:v;}
      if(k==="estudo"){const v=num(g("l-val"));if(!isFinite(v)||v<=0){toast("Informe os minutos, ex: 45");return;}l.value=v;l.topic=g("l-topic").trim();}
      if(k==="treino"||k==="mente"){const v=num(g("l-min"));if(isFinite(v)&&v>0)l.minutes=v;}
      closeSheet();addLog(l);});
  };
  openSheet(draw(),mount);
}

function baseOf(g){let t=String(g.title||"").trim().replace(/\s*·.*$/,"").replace(/\s+(na|por|no|ao|em|toda|todo|a|o)\s+(semana|dia|mês|mes|ano)$/i,"").replace(/\s+(hoje|diári[oa]s?|semana(l|is)?|mensa(l|is)|anua(l|is))$/i,"").trim();

function optMin(c){return S.kinds&&S.kinds[c.kind]?1:2;}
function catEdit(id,refresh){const c=ownCats().find(k=>k.id===id);if(!c)return;const a=AREAS[c.area]||AREAS.body;

    ${c.opts.length<8?`<div class="ce-o ce-new"><span class="ce-plus">＋</span><input id="ce-new" maxlength="20" placeholder="Nova opção, ex: Natação"><button class="btn sm gold" data-oadd>Adicionar</button></div>`:""}
    <p class="hint">Opções novas contam como ${esc((KINDS[c.kind]||{label:c.name}).label.toLowerCase())} nas tasks e no XP. O radial aceita de ${optMin(c)} a 8 opções.</p></div>
    <div class="actions" style="justify-content:space-between"><button class="btn ghost" data-coff>${c.off?"Mostrar botão":"Esconder botão"}</button><button class="btn gold" data-csave>Salvar</button></div>`,sh=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    const saveNames=()=>{c.name=sh.querySelector("#ce-name").value.trim()||c.name;sh.querySelectorAll("[data-ol]").forEach(i=>{const o=c.opts.find(x=>x.id===i.dataset.ol);if(o)o.l=i.value.trim()||o.l;});};
    sh.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.odel){saveNames();if(c.opts.length<=optMin(c))return;c.opts=c.opts.filter(o=>o.id!==b.dataset.odel);saveState();render();catEdit(c.id,true);toast("Opção removida");return;}
      if("oadd" in b.dataset){saveNames();const v=sh.querySelector("#ce-new").value.trim();if(!v){toast("Escreva o nome da opção");return;}const nid="c"+uid();c.opts.push({id:nid,l:v,ic:c.icon,sub:c.kind==="estudo"?undefined:nid,value:c.kind==="estudo"?30:c.kind==="dinheiro"?undefined:undefined,ask:c.kind==="dinheiro"?1:undefined});saveState();syncAreas();render();catEdit(c.id,true);return;}
      if("coff" in b.dataset){saveNames();c.off=!c.off;saveState();closeSheet();render();toast(c.off?"Botão escondido. Volte pelo lápis.":"Botão visível");return;}
      if("csave" in b.dataset){saveNames();saveState();syncAreas();closeSheet();render();toast("Botão salvo");return;}});},refresh);}


/* ---------- Quests editáveis: nome, ícone, cor, quests novas e ordem do Tracking ---------- */
const AREA_C0={money:"var(--money)",body:"var(--body)",family:"var(--family)"};
const AREA_PAL=["#e0a85a","#4fb3c9","#d77fb0","#8fb45a","#7d8ce0","#c98a5e","#5fc2a4","#d4c25a"];
const NOPT_KINDS=new Set(["dinheiro","estudo","agua","stat"]);
function shortOf(t){return String(t||"").replace(/\s+e\s+/gi," & ");}
function mainOf(k){return S.quests.find(q=>q.type==="main"&&q.area===k&&!q.archived)||S.quests.find(q=>q.type==="main"&&q.area===k);}
function syncAreas(){if(!S||!Array.isArray(S.quests))return;
  S.quests.filter(q=>q.type==="main").forEach(q=>{let a=AREAS[q.area];
    if(!a)a=AREAS[q.area]={name:q.title,short:shortOf(q.title),color:q.color||AREA_PAL[0],icon:"star",custom:1};
    if(q.archived&&mainOf(q.area)!==q)return;
    a.name=q.title;a.short=shortOf(q.title);a.color=q.color||AREA_C0[q.area]||a.color;a.off=!!q.archived;});
  const cs=(S.cats||[]);
  Object.entries(S.kinds||{}).forEach(([k,d])=>{const c=cs.find(c=>c.kind===k);const subs={};if(c)c.opts.forEach(o=>{if(o.sub)subs[o.sub]=o.l;});
    KINDS[k]={label:c?c.name:d.label,icon:c?c.icon:(d.icon||"star"),area:d.area,custom:1,subs:Object.keys(subs).length?subs:undefined,hide:!c||c.off||!!(AREAS[d.area]||{}).off};});}
function areaKeys(all){const live=k=>AREAS[k]&&(all||!AREAS[k].off)&&S.quests.some(q=>q.type==="main"&&q.area===k&&(all||!q.archived));
  const ks=(S.areaOrder||["family","money","body"]).filter(live);Object.keys(AREAS).forEach(k=>{if(!ks.includes(k)&&live(k))ks.push(k);});return ks;}
function newCat(area,name,icon){const kid="k"+uid();S.kinds=Object.assign({},S.kinds,{[kid]:{label:name,area,icon}});

      saveState();syncAreas();};
    sh.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
      if("qesave" in b.dataset){save();QARM=null;closeSheet();render();toast("Quest salva");return;}

      if("qeaddcat" in b.dataset){const v=sh.querySelector("#qe-newcat").value.trim();if(!v){toast("Escreva o nome do botão");return;}save();const c=newCat(q.area,v.slice(0,20),areaIcon(q.area));addOpt(c,v);saveState();syncAreas();render();catEdit(c.id);toast("Botão criado. Adicione as opções do radial.");return;}
      if("qearch" in b.dataset){if(QARM!==q.id){QARM=q.id;questEdit(q.id,true);return;}QARM=null;q.archived=true;ownCats().forEach(c=>{if(c.area===q.area)c.off=true;});saveState();syncAreas();closeSheet();render();toast("Quest arquivada. Os registros continuam no Diário.");return;}});},refresh);}

function orgSheet(refresh){const ks=areaKeys();

      if(d.oc){const [id,dir]=d.oc.split("|");const all=ownCats(),c=all.find(x=>x.id===id);if(!c)return;const sib=all.filter(x=>x.area===c.area),i=sib.indexOf(c),o=sib[i+(+dir)];if(!o)return;const ai=all.indexOf(c),bi=all.indexOf(o);[all[ai],all[bi]]=[all[bi],all[ai]];saveState();render();orgSheet(true);return;}

/* ---------- Backup ---------- */
let BKTEXT="",pendingImport=null;
function snapshot(){return {app:"tracking",version:1,exportedAt:new Date().toISOString(),state:S,months:MONTHS};}
function bkDays(){return S&&S.lastExport?Math.floor((Date.now()-new Date(S.lastExport).getTime())/864e5):null;}
function bkAge(){const d=bkDays();return d==null?"nunca":d===0?"hoje":d===1?"ontem":`há ${d} dias`;}
function needBk(){const d=bkDays();return allLogs().length>0&&(d==null||d>=7);}
async function exportFile(){const txt=JSON.stringify(snapshot(),null,1),fn="tracking-backup-"+dayKey(new Date())+".json";
  const ok=()=>{BKTEXT="";S.lastExport=new Date().toISOString();saveState();render();toast("Backup exportado");};
  const C=window.Capacitor,P=C&&C.Plugins;
  if(P&&P.Filesystem&&P.Share){try{const r=await P.Filesystem.writeFile({path:fn,data:txt,directory:"CACHE",encoding:"utf8"});await P.Share.share({title:"Backup do Tracking",text:"Backup do Tracking",files:[r.uri],dialogTitle:"Salvar backup"});ok();}catch(e){if(!/cancel/i.test(String(e&&(e.message||e))))toast("Não consegui exportar");}return;}
  if(window.claude&&typeof window.claude.use==="function"){let d=null;try{d=await window.claude.use("downloads");}catch(e){}
    if(d){try{await d.save({filename:fn,data:txt});ok();return;}catch(e){if(e&&e.code==="declined")return;}}
    BKTEXT=txt;render();toast("Copie o texto do backup");return;}
  try{const blob=new Blob([txt],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);ok();}catch(e){BKTEXT=txt;render();}}
function readImport(f){f.text().then(t=>{const j=JSON.parse(t.trim());if((j.app!=="tracking"&&j.app!=="ficha-de-vida")||!j.state||typeof j.state!=="object"||(j.months&&typeof j.months!=="object"))throw 0;
  for(const mk in (j.months||{})){if(!/^\d{4}-\d{2}$/.test(mk)||!Array.isArray(j.months[mk]))throw 0;}pendingImport=j;armed="import";render();
  setTimeout(()=>{const b=document.querySelector(".bk-conf");b&&b.scrollIntoView({block:"center",behavior:"smooth"});},60);}).catch(()=>toast("Esse arquivo não é um backup do Tracking."));}
function doImport(){const j=pendingImport;if(!j)return;S=j.state;saveState();const ms=j.months||{};MONTHS=Object.assign({},MONTHS);for(const mk in ms){MONTHS[mk]=ms[mk];saveMonth(mk);}
  pendingImport=null;armed=null;prevLevel=null;LASTHTML="";render();toast("Dados restaurados");}
app.addEventListener("change",e=>{if(e.target.id!=="imp")return;const f=e.target.files[0];if(f)readImport(f);});
/* ---------- Atualização automática (APK) ---------- */
const WEB_BUILD=window.WEB_BUILD||0,OTA_BASE="https://raw.githubusercontent.com/Cake-to/tracking-web/main/";
let OTA_LAST=0,OTA_BUSY=false;
function b64buf(buf){let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
async function sha256hex(buf){const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function tfetch(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||15000);try{const r=await fetch(url,{cache:"no-store",signal:c.signal});if(!r.ok)throw new Error("http "+r.status);return r;}finally{clearTimeout(t);}}
async function otaCheck(force){if(!IS_NATIVE())return "web";if(OTA_BUSY)return "busy";if(!force&&Date.now()-OTA_LAST<30*60000)return "skip";OTA_LAST=Date.now();OTA_BUSY=true;
  const P=window.Capacitor.Plugins,FS=P.Filesystem,W=P.WebView;
  try{if(!FS||!W||!P.App)return "error";
    let j;try{j=await (await tfetch(OTA_BASE+"ota.json?t="+Date.now(),8000)).json();}catch(e){return "offline";}const nb=+((await P.App.getInfo()).build)||0;
    if(!(+j.build>WEB_BUILD)||String(j.build)===localStorage.getItem("ota.bad")||!Array.isArray(j.files))return "latest";
    if(nb<(+j.minNative||0))return "native";
    if(localStorage.getItem("ota.ready")===String(j.build))return "new";
    const dir="ota/b"+(+j.build);
    for(const f of j.files){if(!/^[\w.-]+$/.test(f.p))throw new Error("nome");const buf=await (await tfetch(OTA_BASE+f.p+"?b="+j.build,20000)).arrayBuffer();
      if(await sha256hex(buf)!==f.h)throw new Error("hash "+f.p);await FS.writeFile({path:dir+"/"+f.p,data:b64buf(buf),directory:"DATA",recursive:true});}
    const u=await FS.getUri({path:dir,directory:"DATA"});
    localStorage.setItem("ota.path",decodeURIComponent(u.uri.replace(/^file:\/\//,"")));localStorage.setItem("ota.label",String(j.label||("versão "+j.build)));localStorage.setItem("ota.ready",String(+j.build));return "new";
  }catch(e){return "error";}finally{OTA_BUSY=false;}}
let OTAMSG="";
function fmtWhen(t){const d=new Date(t);return isNaN(d)?"":d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")+", "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function verHTML(){const when=fmtWhen(localStorage.getItem("ota.when")||window.WEB_DATE);
  return `<div class="log ver"><div class="d"><b>Versão ${WEB_BUILD}</b><span>${when?"Atualizada em "+esc(when):""}</span>${OTAMSG?`<span class="ver-m">${OTAMSG}</span>`:""}</div>${IS_NATIVE()?`<button class="btn sm" data-otachk ${OTAMSG==="Verificando…"?"disabled":""}>Verificar</button>`:""}</div>`;}

function cycleEnd(p){const n=new Date();if(p==="day")return new Date(n.getFullYear(),n.getMonth(),n.getDate()+1).getTime();
  if(p==="week"){const s=new Date(periodStart("week"));s.setDate(s.getDate()+7);return s.getTime();}
  if(p==="month")return new Date(n.getFullYear(),n.getMonth()+1,1).getTime();if(p==="year")return new Date(n.getFullYear()+1,0,1).getTime();return 0;}
function nativePlan(){const out=[],now=Date.now();if(!S)return out;
  S.quests.filter(q=>q.status==="active"&&q.type==="main"&&!q.archived).forEach(q=>q.goals.filter(g=>!g.off&&g.remind&&g.remind.on).forEach(g=>{
    let until=0;try{const pr=goalProgress(g);if(pr.done&&g.src!=="steps")until=cycleEnd(g.period);}catch(e){}
    const days=g.remind.days||[0,1,2,3,4,5,6],times=remindTimes(g.remind);
    for(let k=0;k<14;k++){const d=new Date();d.setDate(d.getDate()+k);if(!days.includes(d.getDay()))continue;
      times.forEach(t=>{const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+t.slice(0,2),+t.slice(3)).getTime();if(at<=now+30000||at<until)return;
        out.push({at,title:g.title,body:q.title});});}}));
  out.sort((a,b)=>a.at-b.at);return out.slice(0,400).map((n,i)=>({id:1000+i,title:n.title,body:n.body,schedule:{at:new Date(n.at),allowWhileIdle:true},smallIcon:"ic_stat_tracking",iconColor:"#f0c24b"}));}
function nativeSchedule(ask){if(!IS_NATIVE())return;clearTimeout(NSCHED);NSCHED=setTimeout(async()=>{const P=window.Capacitor.Plugins,LN=P&&P.LocalNotifications;if(!LN||!S)return;
  const list=nativePlan(),sig=JSON.stringify(list.map(n=>[n.title,+n.schedule.at]));if(sig===NSIG&&!ask)return;
  try{let perm=await LN.checkPermissions();if(list.length&&perm.display!=="granted"&&ask)perm=await LN.requestPermissions();
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(list.length&&perm.display==="granted")await LN.schedule({notifications:list});NSIG=sig;}catch(e){}},ask?50:900);}
if(IS_NATIVE()){const _ss=saveState;saveState=function(){_ss.apply(this,arguments);nativeSchedule(false);};
  const P=window.Capacitor.Plugins;setTimeout(()=>nativeSchedule(false),1500);
  setTimeout(async()=>{if(await otaApply())return;otaConfirm();setTimeout(()=>otaCheck(true),4000);},1200);
  if(P.App){P.App.addListener("appStateChange",st=>{if(st.isActive){NSIG="";nativeSchedule(false);render();otaCheck(false);}else otaApply();});
    P.App.addListener("backButton",()=>{const no=document.querySelector(".cpop-w [data-cpno]")||document.querySelector(".sug-w [data-sugno]");if(no){no.click();}else if(layer.querySelector(".scrim")){closeSheet();render();}else if(tab!=="track"){const b=document.querySelector('.nav [data-tab="track"]');b?b.click():P.App.minimizeApp();}else P.App.minimizeApp();});}}

(()=>{let drag=null;
  const start=(x,y,target,id)=>{const sh=target.closest&&target.closest(".sheet");if(!sh||target.closest("input,select,textarea,.icpop"))return;const top=sh.getBoundingClientRect().top;
    if(y-top>72&&sh.scrollTop>0)return; // fora do topo e com rolagem: deixa rolar
    drag={sh,y0:y,t0:performance.now(),dy:0,id,top:y-top<=72,last:y,lt:performance.now(),v:0};};
  const move=(y,ev)=>{if(!drag)return false;let dy=y-drag.y0;
    if(!drag.top){ // começou no meio da janela: só arrasta se a janela está no topo da rolagem e o gesto é para baixo
      if(drag.sh.scrollTop>0||dy<=0){if(dy<-6)drag=null;return false;}}
    if(drag.top&&ev&&ev.cancelable)ev.preventDefault();
    dy=Math.max(0,dy);const now=performance.now();drag.v=(y-drag.last)/Math.max(1,now-drag.lt);drag.last=y;drag.lt=now;drag.dy=dy;
    if(dy>3){if(ev&&ev.cancelable)ev.preventDefault();drag.sh.style.transition="none";drag.sh.style.transform=`translateY(${dy}px)`;const sc=drag.sh.closest(".scrim");if(sc)sc.style.opacity=String(Math.max(.35,1-dy/500));}
    return true;};
  const end=()=>{if(!drag)return;const {sh,dy,t0}=drag;const v=Math.max(drag.v,dy/Math.max(1,performance.now()-t0));drag=null;const sc=sh.closest(".scrim");
    if(dy>70||(dy>24&&v>.35)){sh.style.transition="transform .18s ease-in";sh.style.transform="translateY(110%)";setTimeout(()=>{if(sc&&sc.isConnected){sc.style.opacity="";closeFromDrag(sc);}},170);}
    else{sh.style.transition="transform .2s ease-out";sh.style.transform="";if(sc)sc.style.opacity="";}};
  const closeFromDrag=sc=>{const ev=new MouseEvent("click",{bubbles:true,cancelable:true});sc.dispatchEvent(ev);};
  // toque (Android): eventos não passivos para segurar a rolagem e o puxar para atualizar
  layer.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;const t=e.touches[0];start(t.clientX,t.clientY,e.target,"t");},{passive:true});
  layer.addEventListener("touchmove",e=>{if(!drag||drag.id!=="t")return;move(e.touches[0].clientY,e);},{passive:false});
  layer.addEventListener("touchend",e=>{if(!drag||drag.id!=="t")return;const moved=drag.dy>4;end();if(moved&&e.cancelable)e.preventDefault();});
  layer.addEventListener("touchcancel",()=>{if(drag&&drag.id==="t")end();});
  // mouse (PC)
  layer.addEventListener("mousedown",e=>{if(e.button!==0)return;start(e.clientX,e.clientY,e.target,"m");});
  window.addEventListener("mousemove",e=>{if(drag&&drag.id==="m")move(e.clientY,e);});
  window.addEventListener("mouseup",e=>{if(!drag||drag.id!=="m")return;const moved=drag.dy>4;end();if(moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault();};window.addEventListener("click",stop,{capture:true,once:true});setTimeout(()=>window.removeEventListener("click",stop,{capture:true}),60);}});
})();

  if("newquest" in d||"newq2" in d){newQuestSheet();return;}
  if(d.qedit){questEdit(d.qedit);return;}
  if("torg" in d){orgSheet();return;}
  if("newstat" in d){statSheet();return;}
  if(d.editstat){statSheet(d.editstat);return;}
  if("export" in d){exportFile();return;}
  if("glass" in d){S.orbGlass=S.orbGlass===false;saveState();render();return;}
  if("citysearch" in d){citySearch();return;}
  if(d.citypick!=null){cityPick(+d.citypick);return;}
  if("cityloc" in d){cityGeo();return;}
  if("citydel" in d){setLoc(null);CITYRES=null;render();toast("Cidade removida");return;}
  if(d.fx){S[d.fx]=S[d.fx]===false;saveState();render();if(d.fx==="fxSound"&&S.fxSound!==false)sfx("pop",false);return;}
  if("otachk" in d){otaManual();return;}
  if(d.linkt){const off=new Set(S.linksOff||[]);off.has(d.linkt)?off.delete(d.linkt):off.add(d.linkt);S.linksOff=[...off];saveState();render();return;}
  if(d.sugopen){const k=LINKS.find(x=>x.id===d.sugopen);if(k)showSug(k);return;}
  if("savename" in d){S.name=document.getElementById("f-name").value.trim()||S.name;saveState();render();toast("Nome salvo");return;}
  // Ações destrutivas: toque duas vezes
  const two=(key,fn)=>{if(armed===key){armed=null;fn();}else{armed=key;render();}};
  if(d.dellog){two("l"+d.dellog,()=>delLog(d.dellog));return;}
  if(d.delgoal){const [qi,gi]=d.delgoal.split("|");two("g"+gi,()=>{const q=S.quests.find(x=>x.id===qi);q.goals=q.goals.filter(g=>g.id!==gi);saveState();render();});return;}
  if(d.delq){two("q"+d.delq,()=>{S.quests=S.quests.filter(x=>x.id!==d.delq);saveState();render();});return;}
});
boot();
})();
</script>
